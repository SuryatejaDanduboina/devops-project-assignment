events {}

http {
    upstream user_service { server user-service:5001; }
    upstream product_service { server product-service:5002; }
    upstream order_service { server order-service:5003; }

    server {
        listen 80;
        server_name _;

        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"api-gateway"}';
        }

        location /api/users {
            rewrite ^/api/users/?(.*)$ /users/$1 break;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/products {
            rewrite ^/api/products/?(.*)$ /products/$1 break;
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/orders {
            rewrite ^/api/orders/?(.*)$ /orders/$1 break;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
